# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: monointerferenz
description: > # this means to ignore newlines until "baseurl:"
repository: FPittelkow/monointerferenz
url: "https://monointerferenz.de"
baseurl:

timezone: Europe/Brussels

# Build settings
#markdown: kramdown

# Sass settings
sass:
  style: compressed

# Theme settings
theme_mode: standard  # choices are: 'dark', 'standard', 'markdown'

plugins:
  - jekyll-seo-tag
  # - jekyll-minify-html-rs


# Customizations
your_name: monointerferenz
email: operator@monointerferenz.de
grid_image_grayscale: false

navigation:
  - text: Home
    url: /

  - text: About
    url: /about

  - spacer: true

  - text: Search
    url: /search
    secondary: true

  - text: Tags
    url: /tags

  - spacer: true

  - label: Areas

  - categories: true

  - spacer: true

  - text: Music
    url: /music

  # - label: Explore

  # - text: Tags
  #   url: /tags
  #   secondary: true

  - spacer: true

  - label: Stuff

  - text: Downloads
    url: /downloads

  - text: Contact
    url: mailto:operator@monointerferenz.de

navigation_category_exclusions: [download]
navigation_category_exclusions: [music]
navigation_category_titles:
  artifact: Artifacts
